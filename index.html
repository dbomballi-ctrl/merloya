<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merlo Ya - Delivery y Comercios</title>
  <style>
    :root {
      --primary: #ed861d;
      --primary-dark: #d96f0d;
      --secondary: #245b45;
      --green-sierras: #279765;
      --green-light: #eaf6ef;
      --orange-light: #fff3e5;
      --bg: #fffdf9;
      --ink: #29352f;
      --muted: #68736d;
      --line: #eee8df;
      --shadow: 0 10px 30px rgba(45, 65, 52, .09);
    }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
    
    header { background: linear-gradient(180deg,#fff 0%,#fffaf3 100%); color: var(--secondary); padding: 24px 20px 22px; text-align: center; border-bottom: 4px solid var(--primary); box-shadow: 0 4px 18px rgba(0,0,0,.045); position: relative; }
    .brand-container { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
    .logo-img { width: min(430px, 68vw); max-width: 100%; height: auto; display: block; filter: drop-shadow(0 5px 8px rgba(50,70,55,.08)); }
    .brand-slogan { font-size: 16px; color: var(--secondary); font-style: normal; font-weight: 700; margin: 2px 0 0; letter-spacing: .25px; }

    .nav-auth { position: absolute; top: 20px; right: 20px; display: flex; align-items: center; gap: 8px; }
    .nav-auth button { background: var(--primary); color: white; border: none; padding: 9px 15px; border-radius: 999px; cursor: pointer; font-weight: bold; box-shadow: 0 3px 9px rgba(237,134,29,.2); }
    .nav-auth button.secondary { background: var(--secondary); }

    .container { max-width: 1120px; margin: 34px auto; padding: 0 20px; }
    .intro { margin: 0 0 22px; }
    .intro h2 { color: var(--secondary); font-size: clamp(25px,3vw,34px); margin: 0 0 7px; }
    .intro p { margin: 0; color: var(--muted); font-size: 15px; }
    .demo-note { display:inline-flex; align-items:center; gap:7px; margin-top:12px; padding:7px 11px; border-radius:999px; background:var(--orange-light); color:#a95b0c; font-size:12px; font-weight:700; }
    
    .admin-panel { background: var(--green-light); border: 2px solid var(--green-sierras); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .comercio-panel { background: var(--orange-light); border: 2px solid var(--primary); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .user-panel { background: var(--green-light); border: 2px solid var(--green-sierras); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <header>
    <div class="brand-container">
      <img src="logo.png" alt="Merlo Ya" class="logo-img">
      <span class="brand-slogan">El corazón de las sierras, directo a tu puerta.</span>
    </div>
  </header>

  <div class="container" id="inicio">
    <!-- PANEL ADMIN -->
    <div id="panel-admin" class="admin-panel" style="display:none;">
      <h3>📊 Dashboard Admin (Diego y Seba)</h3>
      <p><b>Total Facturado en la App:</b> <span id="admin-total-ventas">$0</span></p>
      <p><b>Comisiones históricas:</b> <span id="admin-total-comision">$0</span></p>
      <div style="margin-top: 20px; border-top: 1px solid #ccc; padding-top: 15px;">
        <h4>Pedidos y Transferencias Recientes</h4>
        <div id="admin-orders-list" style="overflow-x: auto; font-size: 14px;">
          Cargando pedidos...
        </div>
      </div>
    </div>
  </div>

  <script>
    // Función de notificación automática por WhatsApp vía CallMeBot
    function enviarWhatsAppPedido(pedido, destino, telefonoAdmin) {
      const apiKey = '6276391';
      let phone = telefonoAdmin;
      let mensaje = '';

      if (destino === 'admin') {
        mensaje = `🚨 *NUEVO PEDIDO EN MERLO YA* %0A` +
                  `🆔 Pedido #${pedido.id} %0A` +
                  `🏪 Comercio: ${pedido.nombre_comercio} %0A` +
                  `👤 Cliente: ${pedido.nombre_cliente} (${pedido.telefono_cliente}) %0A` +
                  `📍 Dirección: ${pedido.direccion_entrega} %0A` +
                  `💰 Total: $${pedido.monto_total}`;
      }

      const url = `https://api.callmebot.com/whatsapp.php?phone=${phone}&text=${encodeURIComponent(mensaje)}&apikey=${apiKey}`;
      
      fetch(url)
        .then(response => console.log('Notificación WhatsApp enviada:', response.status))
        .catch(err => console.error('Error al enviar WhatsApp:', err));
    }

    // Renderizado seguro y limpio de la tabla de administración
    function renderizarPedidosAdmin(orders) {
      let html = `<table style="width:100%; border-collapse: collapse;">
        <thead>
          <tr style="border-bottom: 2px solid #ccc; text-align: left;">
            <th style="padding: 8px;">ID / Fecha</th>
            <th style="padding: 8px;">Total</th>
            <th style="padding: 8px;">Estado</th>
            <th style="padding: 8px;">Pagos</th>
          </tr>
        </thead>
        <tbody>`;

      orders.forEach(ord => {
        const fecha = new Date(ord.created_at).toLocaleString();
        let pagosHtml = "<ul style='margin:0; padding-left:15px;'>";
        if (ord.transfer_payments) {
          ord.transfer_payments.forEach(p => {
            pagosHtml += `<li><b>${p.payee_type === 'merchant' ? 'Comercio' : 'Merlo Ya'}:</b> $${p.amount} (${p.status})</li>`;
          });
        }
        pagosHtml += "</ul>";

        html += `
          <tr style="border-bottom: 1px solid #eee;">
            <td style="padding: 8px;"><small>${ord.id.slice(0,8)}...</small><br>${fecha}</td>
            <td style="padding: 8px;"><b>$${ord.total_amount}</b></td>
            <td style="padding: 8px;"><span style="background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-size: 12px;">${ord.status}</span></td>
            <td style="padding: 8px;">${pagosHtml}</td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      document.getElementById('admin-orders-list').innerHTML = html;
    }
  </script>
</body>
</html>
